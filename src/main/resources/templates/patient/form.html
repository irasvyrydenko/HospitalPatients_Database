<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pageTitle}">Patient Form</title>
</head>
<body>
<header th:text="${pageTitle}">Register Patient</header>

<section class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <form th:action="${formAction}" th:object="${patientForm}" method="post">

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">First Name</label>
                                <input type="text" th:field="*{firstName}" class="form-control" placeholder="e.g. John" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Last Name</label>
                                <input type="text" th:field="*{lastName}" class="form-control" placeholder="e.g. Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Date of Birth</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control" required>
                        </div>

                        <div class="row mb-4">
                            <div class="col">
                                <label class="form-label fw-bold">Gender</label>
                                <select th:field="*{gender}" class="form-select" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Blood Type</label>
                                <select th:field="*{bloodType}" class="form-select" required>
                                    <option value="">Select Blood Type</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between border-top pt-3">
                            <a th:href="@{/patient}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4" th:text="${submitLabel}">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
