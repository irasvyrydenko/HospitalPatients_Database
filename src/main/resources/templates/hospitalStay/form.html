<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Stay Record</title>
</head>
<body>
<header th:text="'New Stay for ' + ${patient.firstName} + ' ' + ${patient.lastName}">Add Stay</header>

<section class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-4">
                    <form th:action="${formAction}" th:object="${stayForm}" method="post">

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">Room Number</label>
                                <input type="number" th:field="*{roomNumber}" class="form-control" placeholder="e.g. 101" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Bed Number</label>
                                <input type="number" th:field="*{bedNumber}" class="form-control" placeholder="e.g. 2" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label fw-bold">Admission Date</label>
                                <input type="date" th:field="*{admissionDate}" class="form-control" required>
                            </div>
                            <div class="col">
                                <label class="form-label fw-bold">Discharge Date (Optional)</label>
                                <input type="date" th:field="*{dischargeDate}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Anaesthesia Type</label>
                            <select th:field="*{anaesthesiaType}" class="form-select" required>
                                <option value="">Select Type</option>
                                <option value="None">None</option>
                                <option value="Local">Local</option>
                                <option value="General">General</option>
                                <option value="Regional">Regional</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Diagnosis</label>
                            <textarea th:field="*{diagnosis}" class="form-control" rows="3" placeholder="Enter clinical diagnosis..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between border-top pt-3">
                            <a th:href="@{/patient/{id}/hospitalStay(id=${patient.patientId})}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Save Stay Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
