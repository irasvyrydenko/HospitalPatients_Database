<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hospital Stays</title>
</head>
<body>
<header th:text="'Hospital Stay: ' + ${patient.firstName} + ' ' + ${patient.lastName}">
    Patient Stays
</header>

<section class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Stay History</h5>
            <span class="badge bg-light text-primary" th:text="${hospitalStays.size()} + ' Records'">0 Records</span>
            <div>
                <a th:href="@{/patient/{id}/hospitalStay/create(id=${patient.patientId})}" class="btn btn-success btn-sm me-2">
                    <i class="bi bi-plus-circle"></i> New Stay Record
                </a>
                <span class="badge bg-light text-primary" th:text="${hospitalStays.size()} + ' Records'">0 Records</span>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Room / Bed</th>
                    <th>Admission Date</th>
                    <th>Discharge Date</th>
                    <th>Diagnosis</th>
                    <th>Anaesthesia</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(hospitalStays)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-hospital fs-1 d-block mb-2"></i>
                        No hospital stays recorded for this patient.
                    </td>
                </tr>

                <tr th:each="stay : ${hospitalStays}">
                    <td>
                        <strong th:text="'Room ' + ${stay.roomNumber}"></strong>
                        <div class="small text-muted" th:text="'Bed: ' + ${stay.bedNumber}"></div>
                    </td>
                    <td th:text="${stay.admissionDate}">2026-01-01</td>
                    <td th:text="${stay.dischargeDate ?: 'Still Admitted'}"
                        th:classappend="${stay.dischargeDate == null} ? 'text-danger fw-bold' : ''">
                        2026-01-10
                    </td>
                    <td th:text="${stay.diagnosis}">General Checkup</td>
                    <td>
                        <span class="badge rounded-pill bg-info text-dark"
                              th:text="${stay.anaesthesiaType}">Local</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/patient}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Patient List
        </a>
    </div>

</section>
</body>
</html>
