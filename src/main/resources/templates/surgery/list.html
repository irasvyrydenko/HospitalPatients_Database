<!DOCTYPE html>
<html th:replace="~{common/layout :: layout(~{::title}, ~{::header}, ~{::section})}" lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Surgeries</title></head>
<body>
<header th:text="'Surgeries for ' + ${patient.firstName} + ' ' + ${patient.lastName}"></header>
<section class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Surgery History</h5>
            <a th:href="@{/patient/{id}/surgery/create(id=${patient.patientId})}" class="btn btn-success btn-sm">Add a new surgery</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Procedure</th>
                    <th>Room</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${surgeries}">
                    <td th:text="${s.procedureType}" class="fw-bold"></td>
                    <td th:text="${s.operationRoom}"></td>
                    <td th:text="${#temporals.format(s.startTime, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${#temporals.format(s.endTime, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <a th:href="@{/patient}" class="btn btn-link mt-3">Back to Patients</a>
</section>
</body>
</html>
